[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emu-stitch"
version = "1.0.0"
description = "Open-Source Multi-User Emulator Save Synchronizer & Profile Switcher for Handheld Consoles"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "R. F. Hansen-Smith", email = "opensource@emu-stitch.org" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/R-F-HansenSmith/emu-stitch"

[project.scripts]
emu-stitch = "emu_stitch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["emu_stitch"]

[dependency-groups]
dev = ["pytest>=8.0"]
